name: Faxina de salas

on:
  schedule:
    # de 3 em 3 horas: o prazo real de exclusão é o deleteAt + até este intervalo, e o teto de
    # salas ativas só é aplicado aqui. O GitHub atrasa execuções agendadas sob carga, então não
    # dá pra contar com o horário exato.
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# evita duas faxinas ao mesmo tempo (grupo separado do da purge manual: ver purge-data.yml)
concurrency:
  group: faxina-salas
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # firebase-admin@14 exige Node >=22 (a lib não instala corretamente em Node 20)
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-save firebase-admin@14.5.0

      # Substituto ao TTL nativo do Firestore (exigiria plano pago Blaze): a conta de serviço
      # ignora firestore.rules e apaga direto as salas encerradas com deleteAt já vencido.
      - name: Apagar salas vencidas e fechar abandonadas/excedentes
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # opcional: e-mails (separados por vírgula) que ganham conta ilimitada; fora do repo
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: node scripts/cleanup-rooms.mjs
