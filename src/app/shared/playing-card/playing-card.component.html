<div
    class="playing-card"
    [class.playing-card--back]="face === 'back'"
    [class.playing-card--selected]="selected"
>
    @if (face === 'back') {
        <app-logo-mark class="playing-card__mark"></app-logo-mark>
    } @else {
        <span class="playing-card__label">{{ label }}</span>
    }
</div>
